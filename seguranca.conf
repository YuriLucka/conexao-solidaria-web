# Cabeçalhos de segurança do site (incluído no server e em cada location que tem add_header próprio,
# porque um add_header dentro de location anula os herdados).
# Sem script-src na CSP: o Blazor gera um <script type="importmap"> inline a cada publish.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
