# Blazor WebAssembly: arquivos estáticos + rotas do app voltando para o index.html.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/seguranca.conf;

    # O publish já gera .gz pré-comprimido; o nginx entrega direto.
    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    types {
        application/wasm wasm;
    }
    include /etc/nginx/mime.types;

    # Arquivos com hash no nome (_framework): podem ficar em cache para sempre.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/seguranca.conf;
        try_files $uri =404;
    }

    # index.html e appsettings nunca em cache: uma nova versão do site aparece na hora.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/seguranca.conf;
    }
    location ~ ^/appsettings.*\.json$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/seguranca.conf;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"Healthy","servico":"web"}';
    }

    # O site nunca responde /api: sem o Kong na frente, a chamada falha com 404 em vez de receber o index.html.
    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
